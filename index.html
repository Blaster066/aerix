<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AERIX | Tienda de ropa</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #171717;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid #e8e8e8;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 7px;
        }

        nav {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: #222;
            text-decoration: none;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 0.55;
        }

        .hero {
            text-align: center;
            padding: 70px 20px 45px;
        }

        .hero h1 {
            font-size: clamp(42px, 8vw, 88px);
            letter-spacing: 12px;
            margin-bottom: 18px;
        }

        .hero p {
            color: #666;
            font-size: 15px;
        }

        .contenedor {
            width: min(1200px, 86%);
            margin: 0 auto;
        }

        .barra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin: 20px 0 28px;
            flex-wrap: wrap;
        }

        .barra h2 {
            font-size: 23px;
            font-weight: 500;
        }

        .filtros {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input, select {
            border: 1px solid #d7d7d7;
            background: white;
            padding: 11px 13px;
            border-radius: 4px;
            font-size: 14px;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 28px 20px;
            padding-bottom: 70px;
        }

        .producto {
            border: 1px solid #ededed;
            background: #fff;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .producto:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }

        .producto img {
            width: 100%;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            display: block;
            background: #f3f3f3;
        }

        .info {
            padding: 17px;
        }

        .info h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .descripcion {
            color: #777;
            font-size: 13px;
            line-height: 1.5;
            min-height: 39px;
            margin-bottom: 12px;
        }

        .colores {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 10px 0 14px;
        }

        .color {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid #d5d5d5;
            display: inline-block;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .color:hover {
            transform: scale(1.2);
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 3px #222;
        }

        .precio {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .boton {
            display: inline-block;
            width: 100%;
            padding: 12px;
            border: 1px solid #171717;
            background: #171717;
            color: white;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            border-radius: 3px;
            font-size: 13px;
            transition: background 0.2s, color 0.2s;
        }

        .boton:hover {
            background: white;
            color: #171717;
        }

        .contacto {
            background: #f7f7f7;
            text-align: center;
            padding: 65px 20px;
        }

        .contacto h2 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .contacto p {
            color: #666;
            margin-bottom: 25px;
        }

        .boton-whatsapp {
            display: inline-block;
            background: #171717;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 3px;
            transition: opacity 0.2s;
        }

        .boton-whatsapp:hover {
            opacity: 0.75;
        }

        footer {
            padding: 25px;
            text-align: center;
            font-size: 12px;
            color: #777;
            border-top: 1px solid #ededed;
        }

        .sin-resultados {
            grid-column: 1 / -1;
            text-align: center;
            color: #777;
            padding: 40px;
        }

        @media (max-width: 800px) {
            .catalogo {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 18px 12px;
            }

            header {
                padding: 18px 5%;
            }

            .logo {
                font-size: 23px;
            }
        }

        @media (max-width: 500px) {
            .catalogo {
                grid-template-columns: 1fr;
            }

            nav {
                gap: 12px;
            }

            .hero {
                padding-top: 45px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">AERIX</div>
        <nav>
            <a href="#catalogo">Catálogo</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <section class="hero">
        <h1>AERIX</h1>
        <p>Ropa que expresa tu esencia.</p>
    </section>

    <main class="contenedor" id="catalogo">
        <div class="barra">
            <h2>Productos</h2>

            <div class="filtros">
                <input
                    type="text"
                    id="buscador"
                    placeholder="Buscar producto..."
                    oninput="mostrarProductos()"
                >

                <select id="orden" onchange="mostrarProductos()">
                    <option value="normal">Ordenar por</option>
                    <option value="menor">Precio: menor a mayor</option>
                    <option value="mayor">Precio: mayor a menor</option>
                    <option value="nombre">Nombre A-Z</option>
                </select>
            </div>
        </div>

        <div class="catalogo" id="lista-productos"></div>
    </main>

    <section class="contacto" id="contacto">
        <h2>¿Querés hacer una consulta?</h2>
        <p>Escribinos por WhatsApp y te ayudamos con tu compra.</p>
        <a
            class="boton-whatsapp"
            id="contacto-whatsapp"
            target="_blank"
            rel="noopener noreferrer"
        >
            Contactar por WhatsApp
        </a>
    </section>

    <footer>
        © <span id="anio"></span> AERIX. Todos los derechos reservados.
    </footer>

    <script>
        const productos = [{"nombre": "Top básico", "precio": 13000, "imagen": "topirregu.jpeg", "descripcion": "Top con hombro irregular.", "colores": [{"nombre": "Negro", "codigo": "#000000"}, {"nombre": "Blanco", "codigo": "#FFFFFF"}, {"nombre": "Rosa", "codigo": "#E8A0B8"}, {"nombre": "Choco", "codigo": "#662B10"}]}, {"nombre": "strapples basico", "precio": 7000, "imagen": "strapple.jpeg", "descripcion": "Remera amplia con estilo urbano.", "colores": [{"nombre": "Negro", "codigo": "#000000"}, {"nombre": "Blanco", "codigo": "#FFFFFF"}, {"nombre": "Rojo vino", "codigo": "#800505"}, {"nombre": "Chocolate", "codigo": "#662B10"}]}, {"nombre": "tops de tul", "precio": 15000, "imagen": "toppp.jpeg", "descripcion": "tops de tul bordados con lentejuelas", "colores": [{"nombre": "Negro", "codigo": "#000000"}, {"nombre": "Blanco", "codigo": "#FFFFFF"}, {"nombre": "Chocolate", "codigo": "#662B10"}]}, {"nombre": "remera Selene", "precio": 13000, "imagen": "topsalida.jpeg", "descripcion": "Tops super cancheros", "colores": [{"nombre": "Negro", "codigo": "#000000"}, {"nombre": "Blanco", "codigo": "#FFFFFF"}, {"nombre": "Choco", "codigo": "#662B10"}]}, {"nombre": "bodys", "precio": 12000, "imagen": "bodyss.jpeg", "descripcion": "Top con hombro irregular.", "colores": [{"nombre": "Negro", "codigo": "#000000"}, {"nombre": "Blanco", "codigo": "#FFFFFF"}, {"nombre": "Chocolate", "codigo": "#662B10"}, {"nombre": "Rojo", "codigo": "#F10909"}]}, {"nombre": "remera Sophia", "precio": 8000, "imagen": "basicobasico.jpeg", "descripcion": "basicos,ideales para el dia a dia", "colores": [{"nombre": "Negro", "codigo": "#000000"}, {"nombre": "Blanco", "codigo": "#FFFFFF"}, {"nombre": "Chocolate",("codigo"): "#662B10"}, {"nombre":("Rojo"), ("codigo"):("#F10909")}, {"nombre"):("Azul Marino"), ("codigo"):("#23165C")}, {"nombre"):("uva"), ("codigo"):("#690D69")}]}];
        const whatsapp = "5491100000000";

        function formatoPrecio(precio) {
            return "$" + Number(precio).toLocaleString("es-AR");
        }

        function enlaceWhatsApp(mensaje) {
            return "https://wa.me/" + whatsapp + "?text=" +
                   encodeURIComponent(mensaje);
        }

        function mostrarProductos() {
            const lista = document.getElementById("lista-productos");
            const busqueda = document.getElementById("buscador").value.toLowerCase();
            const orden = document.getElementById("orden").value;

            let filtrados = productos.filter(producto =>
                producto.nombre.toLowerCase().includes(busqueda)
            );

            if (orden === "menor") {
                filtrados.sort((a, b) => a.precio - b.precio);
            } else if (orden === "mayor") {
                filtrados.sort((a, b) => b.precio - a.precio);
            } else if (orden === "nombre") {
                filtrados.sort((a, b) => a.nombre.localeCompare(b.nombre));
            }

            if (filtrados.length === 0) {
                lista.innerHTML = '<p class="sin-resultados">No se encontraron productos.</p>';
                return;
            }

            lista.innerHTML = filtrados.map(producto => `
                <article class="producto">
                    <img src="${producto.imagen}" alt="${producto.nombre}">
                    <div class="info">
                        <h3>${producto.nombre}</h3>
                        <p class="descripcion">${producto.descripcion}</p>
                        <div class="colores">
                            ${(producto.colores || []).map(color => `
                                <span
                                    class="color"
                                    title="${color.nombre}"
                                    style="background-color: ${color.codigo};"
                                ></span>
                            `).join("")}
                        </div>
                        <div class="precio">${formatoPrecio(producto.precio)}</div>
                        <a
                            class="boton"
                            href="${enlaceWhatsApp(
                                "Hola AERIX, quiero consultar por: " +
                                producto.nombre + " - " + formatoPrecio(producto.precio)
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Consultar por WhatsApp
                        </a>
                    </div>
                </article>
            `).join("");
        }

        document.getElementById("contacto-whatsapp").href = enlaceWhatsApp(
            "Hola AERIX, quisiera hacer una consulta."
        );

        document.getElementById("anio").textContent = new Date().getFullYear();

        mostrarProductos();
    </script>
</body>
</html>
